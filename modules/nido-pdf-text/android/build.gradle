plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nidopdftext'
version = '0.1.0'

android {
  namespace "expo.modules.nidopdftext"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Same PDF engine and version that expo-pdf-text-extract 1.1.0 used.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
