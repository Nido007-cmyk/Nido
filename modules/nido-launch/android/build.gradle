plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nidolaunch'
version = '0.1.0'

android {
  namespace "expo.modules.nidolaunch"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ShortcutManagerCompat / IconCompat (atajos del icono).
  implementation "androidx.core:core:1.13.1"
}
