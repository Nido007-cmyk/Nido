// 0.1.32: faltaba este archivo, así que la parte Android del módulo nunca
// se compilaba y JS no podía saber si las alarmas exactas estaban
// permitidas (Android 12+): los recordatorios podían llegar con minutos de
// retraso en reposo (Doze) sin que nada lo indicara.

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.exactalarm'
version = '0.1.0'

android {
  namespace "expo.modules.exactalarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
