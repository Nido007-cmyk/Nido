[package]
name = "nido-conformance-rs"
version = "0.1.0"
edition = "2021"
description = "Independent Rust implementation of the NIDO v0 conformance protocol (second implementation, written from the spec and official vectors)"

[[bin]]
name = "nido-conformance-rs"
path = "src/main.rs"

[dependencies]
# Audited / widely-maintained cryptography only. No home-grown crypto.
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
# Shortest-round-trip float formatting for RFC 8785 number serialization.
ryu = "1"

[profile.release]
opt-level = 2
