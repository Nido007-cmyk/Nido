# Knowledge packs built on a computer, two kinds:
#   - knowledge-packs/<pack>.txt: a list of Wikipedia titles (introductions).
#   - knowledge-packs/<pack>/: guides written by NIDO (<lang>/*.md), such as
#     nido-esencial (first aid, health, disasters, survival; es + en).
#
# Builds each pack twice, one per search model the app has (bge: English,
# e5: multilingual), checks it, and uploads both files to a DRAFT release.
# Checks: Wikipedia packs must have the same vectors as the published Vital
# packs for identical text (scripts/check-pack-parity.mjs); guide packs must
# answer a list of real questions with the right guide
# (scripts/check-pack-retrieval.mjs, knowledge-packs/<pack>/retrieval-checks.json).
#
# A draft is invisible to users: the catalog entry (src/models/manifest.ts)
# is signed locally by the maintainer and the release is published with the
# app version that offers the pack. No signing key here.
name: Knowledge pack

on:
  push:
    branches: ['pack/**', 'feat/emergency-pack']
    paths: ['knowledge-packs/**', 'scripts/build-knowledge-pack.mjs', 'scripts/check-pack-parity.mjs', 'scripts/check-pack-retrieval.mjs', 'scripts/lib/knowledge-pack-lib.mjs', '.github/workflows/knowledge-pack.yml']
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack in knowledge-packs/: a title list (name without .txt) or a guides folder'
        default: 'nido-esencial'
      release_tag:
        description: 'Draft release tag for the built packs (a published tag is never reused)'
        default: 'knowledge-packs-v7'

permissions:
  contents: read

concurrency:
  group: knowledge-pack-${{ github.ref }}-${{ inputs.pack || 'auto' }}
  cancel-in-progress: true

env:
  # A push to pack/<name> builds <name> when knowledge-packs/<name> exists
  # (pack/nido-local → nido-local); otherwise NIDO Essentials.
  PACK: ${{ inputs.pack || (startsWith(github.ref_name, 'pack/nido-local') && 'nido-local') || 'nido-esencial' }}
  # v3, v4, v5 and v6 are published and pinned by the signed catalog:
  # never overwrite them. v5 (0.1.55): NIDO Local. v6: the set the
  # signed catalog in this tree offers.
  # A published release is never changed (apps only accept the exact bytes
  # their catalog names). A new pack version needs a NEW tag here (v7, v8…),
  # new sourceUrls in src/models/manifest.ts and new lines in
  # knowledge-packs/release-ledger.json (checked by packReleaseLedger.test.ts).
  # Full audit 2026-10-31 (F7-07): the tag was pinned to v5, so this
  # workflow could not produce what the signed catalog offers; it is
  # now a dispatch input defaulting to v7.
  RELEASE_TAG: ${{ inputs.release_tag || 'knowledge-packs-v7' }}
  # Fixed so a rebuild from the same text gives the same file.
  BUILT_AT: '2026-10-28T00:00:00Z'
  VITAL_BGE_URL: https://github.com/Nido007-cmyk/Nido/releases/download/knowledge-packs-v1/wiki-vital5.sqlite
  VITAL_BGE_SHA256: d3b87d562baba3489f6878bf99783f50d504db94c347029771e53f6d1aecc666
  VITAL_E5_URL: https://github.com/Nido007-cmyk/Nido/releases/download/knowledge-packs-v2/wiki-vital5-e5.sqlite
  VITAL_E5_SHA256: 6eda30dfc736faaad2925ada3f346a51e0211e57353e9842ccb897885da33886

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kind, name and size of the pack
        shell: bash
        run: |
          set -euo pipefail
          case "$PACK" in
            nido-esencial) NAME="NIDO Essentials: first aid, health, disasters and survival" ;;
            nido-local) NAME="NIDO Local: emergency numbers and official alerts by country" ;;
            emergency-survival) NAME="Emergencies and survival" ;;
            *) NAME="$PACK" ;;
          esac
          if [ -d "knowledge-packs/$PACK" ]; then
            echo "KIND=guides" >> "$GITHUB_ENV"
            echo "SOURCE_ARGS=--guides knowledge-packs/$PACK" >> "$GITHUB_ENV"
            n=$(find "knowledge-packs/$PACK" -name '*.md' ! -iname 'readme.md' | wc -l)
            echo "::notice title=Knowledge pack::$PACK: $n guides"
          else
            test -f "knowledge-packs/$PACK.txt"
            echo "KIND=wikipedia" >> "$GITHUB_ENV"
            echo "SOURCE_ARGS=--titles knowledge-packs/$PACK.txt" >> "$GITHUB_ENV"
            echo "::notice title=Knowledge pack::$PACK: $(grep -c . knowledge-packs/$PACK.txt) titles"
          fi
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Build (bge, English search)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-knowledge-pack.mjs $SOURCE_ARGS --id "$PACK" \
            --name "$NAME" --embedding bge --built-at "$BUILT_AT" --threads 4
      - name: Build (e5, multilingual search)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-knowledge-pack.mjs $SOURCE_ARGS --id "$PACK-e5" \
            --name "$NAME (multilingual search)" --embedding e5 --built-at "$BUILT_AT" --threads 4
      - name: Summary
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            for (const id of [process.env.PACK, `${process.env.PACK}-e5`]) {
              const s = JSON.parse(fs.readFileSync(`build/knowledge-pack/${id}.sqlite.json`, "utf8"));
              console.log(`::notice title=Knowledge pack (${id})::${s.articles} ${process.env.KIND === "guides" ? "guides" : "articles"}, ${s.chunks} chunks, ${(s.sizeBytes/1e6).toFixed(2)} MB, sha256 ${s.sha256}`);
            }
            if (process.env.KIND === "wikipedia") {
              const want = fs.readFileSync(`knowledge-packs/${process.env.PACK}.txt`, "utf8").split("\n").map(s => s.trim()).filter(Boolean);
              const s = JSON.parse(fs.readFileSync(`build/knowledge-pack/${process.env.PACK}.sqlite.json`, "utf8"));
              if (s.articles < want.length) console.log(`::warning title=Knowledge pack::${want.length - s.articles} titles gave no article (missing page, or the same article reached through two titles)`);
            }
          '
      - name: Parity with the published Vital packs (Wikipedia packs)
        if: env.KIND == 'wikipedia'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ref
          curl -fsSL --retry 3 "$VITAL_BGE_URL" -o ref/vital.sqlite
          curl -fsSL --retry 3 "$VITAL_E5_URL" -o ref/vital-e5.sqlite
          echo "$VITAL_BGE_SHA256  ref/vital.sqlite" | sha256sum -c -
          echo "$VITAL_E5_SHA256  ref/vital-e5.sqlite" | sha256sum -c -
          node scripts/check-pack-parity.mjs "build/knowledge-pack/$PACK.sqlite" ref/vital.sqlite --github
          node scripts/check-pack-parity.mjs "build/knowledge-pack/$PACK-e5.sqlite" ref/vital-e5.sqlite --github
      - name: Real questions find the right guide (guide packs)
        if: env.KIND == 'guides'
        shell: bash
        run: |
          set -euo pipefail
          CHECKS="knowledge-packs/$PACK/retrieval-checks.json"
          test -f "$CHECKS"
          # bge is an English model: English questions only.
          node scripts/check-pack-retrieval.mjs "build/knowledge-pack/$PACK.sqlite" "$CHECKS" \
            --model assets/models/embedding.gguf --langs en --top 3 --min 0.9 --github
          # e5 is the multilingual model the app uses for Spanish and Portuguese.
          node scripts/check-pack-retrieval.mjs "build/knowledge-pack/$PACK-e5.sqlite" "$CHECKS" \
            --model assets/models/embedding-multilingual.gguf --top 3 --min 0.9 --github
          # 0.1.60 (evaluación v2): las preguntas de primeros auxilios
          # (casos FA-* de src/eval/cases/v2.json) tienen que acertar TODAS:
          # --min 0.9 es un porcentaje global y dejaría pasar un fallo aquí.
          FA="knowledge-packs/$PACK/first-aid-checks.json"
          if [ -f "$FA" ]; then
            node scripts/check-pack-retrieval.mjs "build/knowledge-pack/$PACK.sqlite" "$FA" \
              --model assets/models/embedding.gguf --langs en --top 3 --min 1.0 --github
            node scripts/check-pack-retrieval.mjs "build/knowledge-pack/$PACK-e5.sqlite" "$FA" \
              --model assets/models/embedding-multilingual.gguf --top 3 --min 1.0 --github
          fi
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PACK" = nido-local ]; then
            cat > "LICENSE-$PACK.txt" <<'TXT'
          NIDO Local (nido-local) is written by NIDO
          (https://github.com/Nido007-cmyk/Nido) from public information by the
          authorities and organizations cited in each guide (US National Weather
          Service, Government of Mexico, Dominican Republic 9-1-1 system and COE,
          Puerto Rico 9-1-1, Cuba's Civil Defense as reported by EFE, Spanish
          consulates and embassies). The text is licensed under CC BY 4.0
          (https://creativecommons.org/licenses/by/4.0/): share and adapt it,
          crediting NIDO and linking the license. The cited organizations did not
          write or review these guides and do not endorse NIDO.
          General information only. Alerts and numbers can change: always follow
          your local authorities. In an emergency, call your local emergency number.
          TXT
          elif [ "$KIND" = guides ]; then
            cat > "LICENSE-$PACK.txt" <<'TXT'
          NIDO Essentials (nido-esencial) is written by NIDO
          (https://github.com/Nido007-cmyk/Nido) from public guidance by the
          organizations cited in each guide (IFRC, Red Cross societies, AHA, WHO,
          UNICEF, CDC, FEMA/Ready.gov, NOAA, USGS and others). The text is licensed
          under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/): share and
          adapt it, crediting NIDO and linking the license. The cited organizations
          did not write or review these guides and do not endorse NIDO.
          General information only: not a substitute for a first aid course or for
          professional help. In an emergency, call your local emergency number.
          TXT
          else
            cat > "LICENSE-$PACK.txt" <<'TXT'
          NIDO knowledge packs in this release are compiled by NIDO
          (https://github.com/Nido007-cmyk/Nido) from Wikipedia article
          introductions (https://www.wikipedia.org). The text is licensed under
          CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/), and so
          is each pack as a whole. If you share or adapt a pack, credit NIDO and
          Wikipedia, link the license, say what you changed, and keep CC BY-SA 4.0.
          The packs give general information only. They are not medical advice:
          in an emergency, call your local emergency number.
          TXT
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error title=Knowledge pack::$RELEASE_TAG is already published; its files are pinned by the signed catalog. Use a new tag."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "Knowledge packs ${RELEASE_TAG#knowledge-packs-}" \
              --notes "Draft: knowledge packs built by .github/workflows/knowledge-pack.yml. Published with the app version that offers them."
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "build/knowledge-pack/$PACK.sqlite" "build/knowledge-pack/$PACK-e5.sqlite" \
            "build/knowledge-pack/$PACK.sqlite.json" "build/knowledge-pack/$PACK-e5.sqlite.json" "LICENSE-$PACK.txt"
          echo "::notice title=Knowledge pack::uploaded to draft release $RELEASE_TAG"
