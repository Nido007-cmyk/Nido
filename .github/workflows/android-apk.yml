# Real Android build (P1: ANDROID COMPILED) — STANDALONE private-alpha profile.
#
# Builds the REAL project with REAL Gradle on a GitHub-hosted runner —
# an environment where the Gradle daemon's loopback IPC works.
# This workflow exists because the dev sandbox intercepts JVM loopback
# traffic, which makes any local Gradle invocation fail at daemon dispatch
# (environmental, not a project bug). It does not modify app architecture.
#
# Trigger: manual (workflow_dispatch) or push to main touching build inputs.
# Output: standalone release APK (JS bundle embedded, no Metro needed)
# uploaded as a workflow artifact.
#
# Build-profile distinction (deliberate, 2026-09-27): the private-alpha
# candidate is built with assembleRelease, NOT assembleDebug, so it does
# not inherit development-only properties:
# - the JS bundle is embedded (bundleInRelease) → cold-launch without Metro,
#   adb reverse, or a dev server;
# - __DEV__ is false → the production security paths are active
#   (keyManager fail-closed when SecureStore is unavailable; no
#   dev-plaintext database fallback);
# - expo-dev-client was removed from app.json → no dev-launcher surfaces
#   and no dev-injected usesCleartextTraffic.
# Signing: withReleaseSigning uses NIDO_UPLOAD_* keys when present (injected
# from the NIDO_UPLOAD_* GitHub Secrets into ~/.gradle/gradle.properties by
# the "Set up release signing keystore" step), otherwise Expo's default debug
# signing. See docs/SIGNING.md.
#
# 2026-09-27: a completed/failed run died mid-Gradle-build with no logs at
# all — consistent with the runner running out of disk (GitHub-hosted
# ubuntu runners ship with limited free space and this build pulls a full
# Android SDK + Gradle caches + native .so outputs). The first steps of the
# job now report `df -h`, aggressively remove large preinstalled tooling we
# do not need (dotnet, ghc, boost, swift, docker images), and report `df -h`
# again, so a future disk-full failure is diagnosable instead of silent.
# This touches ONLY the CI environment: no app code, no dependencies.
#
# 2026-09-27 (later): run 36324833967 STILL died of disk-full even with the
# single-ABI build (26G free after the first cleanup was not enough — the
# llama.cpp native build via :llama.rn:bundleDebugAar ate the rest). Added a
# second, deeper cleanup AFTER the setup steps: hostedtoolcache languages we
# never use (Python/PyPy/Go/Ruby), Android SDK pieces a Gradle APK build
# never touches (emulator, system-images, extras), and the npm cache after
# install. Also added `concurrency: cancel-in-progress` so a new push
# cancels stale runs instead of piling up doomed 90-minute builds.

name: Android APK

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A4 (auditoría 2026-10-10): un release se publica SOLO al empujar un tag
    # v*. Los pushes a main compilan y dejan el APK como artifact del run.
    tags: ['v*']
    paths:
      - 'android/**'
      - 'src/**'
      - 'modules/**'
      - 'plugins/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

# A10 (auditoría 2026-10-10): solo lectura por defecto. El permiso de
# escritura vive únicamente en el job `release`, que no ejecuta npm ni Gradle.
permissions:
  contents: read

jobs:
  build-apk:
    # Fijado: ubuntu-latest pasa a Ubuntu 26 (beta) desde el 2026-10-19;
    # cambiar de imagen se prueba en una rama aparte, no por sorpresa.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Disk space before cleanup
        run: df -h

      - name: Free disk space for Android build
        run: |
          # Remove large preinstalled toolchains this build never uses.
          # Keep the Android SDK location (/usr/local/lib/android/sdk) intact:
          # setup-android installs platform-tools there in the next step.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          sudo apt-get clean || true

      - name: Disk space after cleanup
        run: df -h

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The action defaults to `packages: tools platform-tools`, but the
          # obsolete `tools` package no longer exists in the SDK repository
          # and makes sdkmanager exit 1. Install only what is needed here;
          # Gradle downloads build-tools/platforms itself (licenses are
          # pre-accepted by this action).
          # 0.1.47: el NDK se instala aquí (antes lo descargaba Gradle a
          # mitad de compilación y una descarga fallida tumbó un build).
          packages: platform-tools ndk;27.0.12077973

      - name: Install JS dependencies
        run: npm ci

      - name: Third-party notices (bundled into the app)
        # Las licencias de los paquetes que se compilan dentro del APK
        # viajan con él (Acerca de → Licencias): se regeneran aquí, desde
        # el node_modules exacto de esta compilación, antes de empaquetar.
        run: npm run notices

      - name: Verify dependency pins (F-8 build gate)
        # The release/Hermes APK must be built from the exact native modules
        # we reviewed: fail the build if any native/security-sensitive dep
        # floats on a ^/~ range or diverges from the lockfile.
        run: npm run verify:deps

      - name: Typecheck (CICD-01 gate)
        # Never ship an APK from code that doesn't typecheck.
        run: npm run typecheck

      - name: SQLCipher real para la batería (F6-01)
        # Auditoría completa 2026-10-31 (F6-01): la única prueba
        # contra SQLCipher real (sqlcipherReal.test.ts) se saltaba
        # en CI por no estar el módulo de Python, y la batería
        # contaba ese salto en silencio. La rueda con binario lo
        # trae compilado: instalarla convierte el salto en una
        # ejecución real contra el cifrado de verdad.
        run: python3 -m pip install --quiet sqlcipher3-binary

      - name: Unit tests (CICD-01 gate)
        # Never ship an APK from code with failing tests.
        run: npm test

      - name: Component tests (CICD-01 gate)
        # 0.1.37 (auditoría): la release corría solo vitest; las suites de
        # componentes (Jest) y la comprobación de pins solo estaban en CI,
        # que no corre en tags. Mismas puertas que ci.yml.
        run: npm run test:components

      - name: Verify download pins (CICD-01 gate)
        run: npm run verify:pins

      - name: Verify manifest signature (CICD-01 gate)
        run: npm run verify:manifest-sig

      - name: Deep-clean runner disk (after tool setup)
        run: |
          # setup-node/setup-java/setup-android have run: their tools live in
          # /opt/hostedtoolcache and $ANDROID_SDK_ROOT — remove only what the
          # Gradle APK build never touches.
          echo "--- biggest dirs before deep clean ---"
          sudo du -sh /opt/* /usr/local/* 2>/dev/null | sort -rh | head -12
          # Hostedtoolcache languages this build never uses.
          sudo rm -rf /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy \
                       /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          # Android SDK pieces a pure Gradle APK build never touches.
          for sdk in "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            [ -n "$sdk" ] && [ -d "$sdk" ] && sudo rm -rf "$sdk/emulator" \
              "$sdk/system-images" "$sdk/extras" || true
          done
          # npm cache is dead weight after `npm ci`.
          npm cache clean --force || true
          echo "--- disk after deep clean ---"
          df -h

      - name: Expo prebuild (Android, clean)
        run: npx expo prebuild -p android --clean --non-interactive

      - name: Set up release signing keystore (NIDO identity)
        # The release keystore lives ONLY in the NIDO_UPLOAD_* GitHub Secrets
        # (never in git). Decodes it to a temp file and points Gradle at it
        # via ~/.gradle/gradle.properties. If the secrets are absent, the
        # build falls back to Expo's default debug signing.
        env:
          NIDO_UPLOAD_STORE_FILE_B64: ${{ secrets.NIDO_UPLOAD_STORE_FILE }}
          NIDO_UPLOAD_STORE_PASSWORD: ${{ secrets.NIDO_UPLOAD_STORE_PASSWORD }}
          NIDO_UPLOAD_KEY_ALIAS: ${{ secrets.NIDO_UPLOAD_KEY_ALIAS }}
          NIDO_UPLOAD_KEY_PASSWORD: ${{ secrets.NIDO_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$NIDO_UPLOAD_STORE_FILE_B64" ]; then
            echo "FATAL (CICD-02): NIDO signing secrets are missing. Refusing to produce a debug-signed 'release' APK under the release artifact name."
            exit 1
          fi
          mkdir -p ~/.gradle
          echo "$NIDO_UPLOAD_STORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/nido-release.p12"
          cat > ~/.gradle/gradle.properties <<EOF
          NIDO_UPLOAD_STORE_FILE=$RUNNER_TEMP/nido-release.p12
          NIDO_UPLOAD_STORE_PASSWORD=$NIDO_UPLOAD_STORE_PASSWORD
          NIDO_UPLOAD_KEY_ALIAS=$NIDO_UPLOAD_KEY_ALIAS
          NIDO_UPLOAD_KEY_PASSWORD=$NIDO_UPLOAD_KEY_PASSWORD
          EOF
          echo "Release signing configured (NIDO identity)."

      - name: Assemble standalone release APK (real Gradle build)
        working-directory: android
        # Private-alpha APK targets physical phones (arm64-v8a). Building
        # all 4 ABIs exhausts the runner disk (llama.cpp native outputs are
        # huge); restrict to arm64-v8a to fit. Release builds can re-enable ABIs.
        # assembleRelease (not assembleDebug): embeds the JS bundle so the app
        # cold-launches without Metro, and __DEV__=false activates the
        # production security paths (fail-closed key management).
        shell: bash
        run: |
          # 0.1.47: si falla, el motivo sale como anotación (los logs de CI
          # no siempre se pueden abrir).
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            grep -A12 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r l; do echo "::error title=gradle::$l"; done
            grep -iE "^e: |error:|ERROR:|FAILURE" "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r l; do echo "::error title=gradle::$l"; done
            exit 1
          }

      - name: Manifest summary (permissions and exported components)
        # 0.1.47 (auditoría): el manifiesto FINAL (tras fusionar los de todas
        # las librerías) queda a la vista en cada compilación, como anotación.
        if: always()
        shell: bash
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$AAPT2" ] || [ ! -f "$APK" ]; then echo "sin aapt2 o sin APK"; exit 0; fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          python3 scripts/manifest-summary.py manifest.txt --github

      - name: Native ML-KEM in the APK
        # 0.1.51: el APK tiene que llevar mlkem-native (libnidomlkem.so) para
        # cada ABI; si falta en arm64-v8a, la compilación falla.
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          LIBS=$(unzip -l "$APK" | awk '{print $4}' | grep 'libnidomlkem\.so$' || true)
          echo "::notice title=ML-KEM nativo en el APK::$(echo $LIBS | tr ' ' ',')"
          echo "$LIBS" | grep -q '^lib/arm64-v8a/libnidomlkem\.so$'

      - name: Android runtime dependencies (P-10)
        # 0.1.55: las librerías Android que Gradle mete en el APK (AndroidX,
        # Kotlin, SQLCipher, BouncyCastle…) no salen de npm y no estaban en
        # THIRD_PARTY_NOTICES. Su árbol exacto, el de ESTA compilación, se
        # guarda y se adjunta al release. Si falla, no tumba el APK.
        # Auditoría profesional 2026-10-31 (B-3): el activo salía con el
        # diario de configuración de Expo pegado delante (versiones, plugins
        # y códigos ANSI), así que se leía como un registro de construcción
        # y no como la lista que su nombre promete. El informe de Gradle se
        # captura en crudo y el activo se recorta a su sección: el árbol de
        # releaseRuntimeClasspath y su leyenda, sin códigos de color.
        # Auditoría completa 2026-10-31 (F7-02 y F7-03): B-3 limpiaba el
        # formato pero ninguna guarda distinguía un árbol exacto de uno
        # truncado o de la salida de un Gradle fallido (la única era
        # test -s en el adjunto). Ahora el recorte se ancla al encabezado
        # real «Project ':app'», el sed quita toda secuencia CSI (no solo
        # las SGR terminadas en m), el separador tras el encabezado se
        # conserva, y el paso falla sin escribir el activo si falta la
        # línea de la configuración, la leyenda de Gradle al final o un
        # mínimo de líneas de dependencia.
        working-directory: android
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          RAW="$RUNNER_TEMP/android-runtime-dependencies.raw.txt"
          OUT="$GITHUB_WORKSPACE/android-runtime-dependencies.txt"
          TMP="$RUNNER_TEMP/android-runtime-dependencies.tmp.txt"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q --console=plain \
            > "$RAW"
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$RAW" \
            | awk '/^Project .:app.$/{show=1} show' \
            > "$TMP"
          fail() { echo "::error title=Dependencias Android::$1"; exit 1; }
          head -1 "$TMP" | grep -qE "^Project .:app.$" || fail "no aparece el encabezado Project ':app'"
          grep -q '^releaseRuntimeClasspath - ' "$TMP" || fail "falta la línea de la configuración releaseRuntimeClasspath"
          grep -q '^(c) - ' "$TMP" || fail "falta la leyenda de Gradle (c)"
          grep -q '^(\*) - ' "$TMP" || fail "falta la leyenda de Gradle (*)"
          tail -n 6 "$TMP" | grep -qE '^\((c|\*)\) - ' || fail "la leyenda no está al final: informe truncado"
          N=$(grep -cE -- '--- [^ ]+:[^ ]+:' "$TMP" || true)
          [ "$N" -ge 100 ] || fail "solo $N líneas de dependencia (mínimo 100): informe sospechoso"
          mv "$TMP" "$OUT"
          echo "::notice title=Dependencias Android en el APK::$N líneas de dependencia (archivo adjunto al release)"
          grep -oiE '(org\.bouncycastle|net\.zetetic)[^ ]*' "$OUT" | sort -u | head -20 \
            | while IFS= read -r l; do echo "::notice title=Dependencia nativa destacada::$l"; done
      - name: Upload Android dependency list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: nido-android-dependencies
          path: android-runtime-dependencies.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nido-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK checksum
        # A4: el SHA-256 se calcula en CI sobre el APK exacto que se publica.
        working-directory: android/app/build/outputs/apk/release
        run: sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Upload APK checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nido-standalone-apk-sha256
          path: android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

  release:
    # A4/A10: publica el APK junto a su SHA-256.
    # - Con un tag v*: publica en ese tag.
    # - En main: publica UNA vez por versión. El tag es v<versión de
    #   package.json>-alpha; si ese release ya existe no se toca (el APK de
    #   una versión publicada nunca se reemplaza). Para publicar de nuevo hay
    #   que subir la versión.
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # 0.1.55 (P-07): lanzar la compilación reproducible contra el release.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            CHANGELOG.md
            docs/ALPHA_RELEASE_NOTES.md
            scripts/generate-sbom.mjs
            scripts/lib/third-party-notices-lib.mjs
            scripts/repair-release-assets.sh
          sparse-checkout-cone-mode: false

      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")-alpha"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ya existe: no se reemplaza."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Sin condición de publish (F7-06): la rama de reparación también
      # necesita los artefactos de esta corrida (la lista de
      # dependencias sale de aquí). En la rama de publicación es la
      # misma descarga de siempre.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # Auditoría completa 2026-10-31 (F7-06): si la release ya existe
      # (publish=false), los adjuntos con continue-on-error de la
      # primera pasada no se reintentaban jamás y la release quedaba
      # incompleta en silencio. Este paso comprueba los activos
      # esperados y adjunta los que falten (el SBOM se regenera del
      # lockfile; la lista sale del artefacto de esta corrida). Sin
      # continue-on-error: una release que no se puede reparar debe
      # verse como un run en rojo, no como otro silencio.
      - name: Repair missing release assets
        if: steps.tag.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/repair-release-assets.sh "$TAG" dist

      - name: Verify checksum
        if: steps.tag.outputs.publish == 'true'
        working-directory: dist
        run: sha256sum -c app-release.apk.sha256

      # Las notas se COMPONEN desde el CHANGELOG (sección de la versión
      # que se publica) + las partes fijas de ALPHA_RELEASE_NOTES.md
      # (qué es NIDO, limitaciones, aviso de seguridad). Antes el body era
      # el archivo fijo tal cual, y cada release salía con el título y los
      # cambios de la versión anterior hasta corregirlos a mano por API
      # (pasó en 0.1.19 y 0.1.20). Sin sección en el CHANGELOG, el job
      # FALLA a propósito: mejor un release detenido que notas falsas.
      - name: Compose release notes
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          tag = os.environ['TAG']
          ver = tag.lstrip('v')
          notes = open('docs/ALPHA_RELEASE_NOTES.md').read()
          ch = open('CHANGELOG.md').read()
          m = re.search(r'^## ' + re.escape(ver) + r'\b.*?(?=^## |\Z)', ch, re.M | re.S)
          if not m:
              sys.exit(f'CHANGELOG.md has no section for {ver}: refusing to publish stale notes')
          ch_body = m.group(0).strip().split('\n', 1)[1].strip()
          # 0.1.55 (auditoría): el corte buscaba «## What changed in», pero
          # el archivo usa «## Earlier releases» y «### What changed in…»:
          # el body llevaba el archivo entero (240 líneas de notas viejas
          # antes de los cambios) y las limitaciones dos veces.
          head = re.split(r'^## (?:Earlier releases|What changed in )', notes, flags=re.M)[0]
          head = re.sub(r'^# NIDO \S+ — Release Notes', f'# NIDO {tag} — Release Notes', head, count=1)
          head = re.sub(r'^> .*?(?=^## )', '', head, count=1, flags=re.M | re.S).rstrip()
          tail = '## Known limitations' + notes.split('## Known limitations', 1)[1]
          body = f"{head}\n\n## What changed in {ver}\n\n{ch_body}\n\n{tail}"
          open('release-notes.md', 'w').write(body)
          print(f'composed release notes for {ver}: {len(body)} bytes')
          PY

      - name: Upload APK to release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NIDO ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
          fail_on_unmatched_files: true

      # Blindaje 0.1.44: lista de componentes (SBOM, formato CycloneDX) de
      # las dependencias de producción, generada del lockfile y adjunta al
      # release. Si falla, el release ya publicado no se toca.
      # Auditoría completa 2026-10-31 (F7-04): «npm sbom» (con o sin
      # --package-lock-only) omite la mayor parte del árbol y deja
      # fuera react y react-native: 221 componentes frente a los 590
      # paquetes de producción del lockfile. El SBOM se genera ahora
      # desde el lockfile con scripts/generate-sbom.mjs, que falla si
      # el conjunto sale recortado.
      - name: Attach SBOM
        if: steps.tag.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/generate-sbom.mjs nido-sbom.cdx.json
          test -s nido-sbom.cdx.json
          gh release upload "$TAG" nido-sbom.cdx.json --repo "$GITHUB_REPOSITORY"

      # 0.1.55 (P-10): el árbol de librerías Android de esta compilación.
      - name: Attach Android dependency list
        if: steps.tag.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Auditoría completa 2026-10-31 (F7-02): test -s solo
          # distingue vacío de no vacío; el adjunto exige el mismo
          # contenido que el paso generador ya validó.
          test -s dist/android-runtime-dependencies.txt
          head -1 dist/android-runtime-dependencies.txt | grep -qE "^Project .:app.$"
          grep -q '^(\*) - ' dist/android-runtime-dependencies.txt
          gh release upload "$TAG" dist/android-runtime-dependencies.txt --repo "$GITHUB_REPOSITORY"

      # 0.1.55 (P-07): cada release se comprueba solo. Lanza dos
      # compilaciones independientes del mismo commit y las compara con el
      # APK recién publicado (reproducible.yml). Antes había que lanzarlo a
      # mano. workflow_dispatch es de los pocos eventos que GITHUB_TOKEN sí
      # puede disparar. Si falla el disparo, el release ya publicado no se toca.
      - name: Start reproducible-build check against this release
        if: steps.tag.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run reproducible.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f ref="$GITHUB_SHA" -f release_tag="$TAG"
          echo "::notice title=Compilación reproducible::lanzada contra $TAG (commit $GITHUB_SHA)"
