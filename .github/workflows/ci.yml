name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A10 (auditoría 2026-10-10): permisos mínimos para el token del workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    # H-5: fail on any secret that is not an allowlisted test fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:pins
      - run: npm run verify:manifest-sig
