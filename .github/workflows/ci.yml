name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A10 (auditoría 2026-10-10): permisos mínimos para el token del workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    # H-5: fail on any secret that is not an allowlisted test fixture.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Auditoría completa 2026-10-31 (F6-01): que la prueba contra
      # SQLCipher real corra también aquí y no se salte en silencio.
      - run: python3 -m pip install --quiet sqlcipher3-binary==0.6.0
      - run: npm run verify:deps
      - run: npm run typecheck
      # Recuento verificable: los reportes JSON alimentan el aviso de abajo.
      - run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      # Auditoría 2026-10-12: las suites de componentes (Jest) llevaban rojas
      # e invisibles desde el 2026-10-10 (mocks de tema viejos y módulos
      # expo ESM sin stub en jest.config.js). Diagnosticadas y en verde
      # (5 suites, 15 tests): desde esta versión corren como puerta.
      - run: npm run test:components -- --json --outputFile=jest-results.json
      # Paquete NIDO-MANT-2026-11-13, encargo 4: el recuento sale de aquí y
      # se puede auditar. Resumen por corredor (pasadas, fallidas,
      # omitidas, total), ficheros con omitidas, comando, entorno y run,
      # en el resumen del paso y en el artefacto test-summary. Los fallos
      # siguen saliendo como anotación por si el log no se puede leer.
      - name: Test count
        if: always()
        run: node scripts/test-summary.mjs vitest-results.json jest-results.json test-summary.json
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-summary
          path: |
            test-summary.json
            vitest-results.json
            jest-results.json
          if-no-files-found: warn
          retention-days: 90
      # Desde 0.1.96: toda cifra de pruebas de las notas declara comando,
      # entorno y run (docs/release/RELEASE_MODEL.md, §Test figures).
      - run: node scripts/check-release-test-figures.mjs
      - run: npm run verify:pins
      # 0.1.60: cada regla firme de la constitución tiene sus comprobaciones.
      - run: node scripts/check-constitution.mjs --github
      - run: npm run verify:manifest-sig
      # Avisos de licencias de terceros (2026-10-14): se generan desde
      # node_modules para comprobar que el generador funciona y avisar si
      # lo subido está desfasado. No bloquea: el APK los regenera al
      # compilar y el workflow third-party-notices los sube al repo.
      - name: Third-party notices
        run: |
          npm run notices
          node -e 'const n=require("./src/legal/thirdPartyNotices.json");console.log(`::notice title=Third-party notices::${n.count} packages, ${Object.keys(n.texts).length} distinct license texts, ${n.withoutText.length} without a license file`)'
          git diff --quiet -- src/legal THIRD_PARTY_NOTICES.md || echo "::warning title=Third-party notices::the committed notices differ from node_modules (the third-party-notices workflow updates them)"

  # 0.1.76: el medidor de ritmo de la RCP analiza los fotogramas en Kotlin
  # (CprMotionCore.kt); sus pruebas de punta a punta corren sobre la misma
  # lógica en TypeScript (src/cpr/frameMotion.ts). Esta puerta compila el
  # Kotlin en la JVM y exige que los dos den los mismos números.
  cpr-motion-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: kotlinc 2.1.21 (hash fijado)
        run: |
          curl -fsSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          echo "1ba08a8b45da99339a0601134cc037b54cf85e9bc0edbe76dcbd27c2d684a977  kc.zip" | sha256sum -c -
          unzip -q kc.zip -d "$RUNNER_TEMP"
      - run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" node --no-warnings scripts/check-cpr-motion-parity.mjs
