# Compilación reproducible (0.1.46).
#
# Compila el APK DOS veces en dos máquinas distintas, desde el mismo commit,
# y comprueba con scripts/compare-apk.py que salen iguales byte a byte salvo
# la firma. Si se indica `release_tag`, además compara con el APK publicado
# en ese release: así cualquiera puede comprobar que el APK de GitHub sale
# exactamente del código publicado (mismo método que usan Signal y Briar).
#
# Las dos compilaciones van sin la clave de firma de NIDO (firma de debug):
# la firma no se compara, solo el contenido.
name: Reproducible build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, rama o tag a compilar'
        required: false
        default: 'main'
      release_tag:
        description: 'Release con el que comparar (p. ej. v0.1.46-alpha). Vacío = solo las dos compilaciones.'
        required: false
        default: ''
  schedule:
    - cron: '23 4 * * 6'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run notices
      - name: Deep-clean runner disk
        run: |
          sudo rm -rf /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          for sdk in "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            [ -n "$sdk" ] && [ -d "$sdk" ] && sudo rm -rf "$sdk/emulator" "$sdk/system-images" "$sdk/extras" || true
          done
          npm cache clean --force || true
      - run: npx expo prebuild -p android --clean --non-interactive
      - name: Assemble release APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-${{ matrix.copy }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || 'main' }}
          sparse-checkout: scripts/compare-apk.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
      - name: Two independent builds are identical
        run: |
          echo "## Compilación reproducible" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare-apk.py dist/apk-a/app-release.apk dist/apk-b/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Same as the published release
        if: inputs.release_tag != ''
        run: |
          gh release download "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir published
          echo "### Contra el release ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare-apk.py dist/apk-a/app-release.apk published/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"
