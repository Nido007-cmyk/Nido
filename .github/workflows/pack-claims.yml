name: Pack sources check

# Weekly: every verified number in the knowledge packs must still be quoted by
# its official source. A red run means a pack needs a review before the next
# release.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "knowledge-packs/**/facts.json"
      - "scripts/check-pack-claims.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check every quote against its source
        run: |
          status=0
          for f in knowledge-packs/*/facts.json; do
            node scripts/check-pack-claims.mjs "$f" --max-age 180 || status=1
          done
          exit $status
